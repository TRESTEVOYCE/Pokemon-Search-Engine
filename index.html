<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pokemons</title>
    <link rel="stylesheet" href="styles.css">
    
</head>
<body>

    <div class="title-container">
        <img src="" alt="" id="header-sprite">
        <h1 class="tile"> SEARCH YOUR POKEMON!</h1>
    </div>

    <div class="input-box">
        <label> Please Enter a pokemon</label>
        <input type="text" placeholder="Enter A Pokemon Name" id="input-pokemon">
        <button id="search-button" onclick="fetchData()" >Search</button>
    </div>

    <div class="parent-container">
        <div class = "pokemon-card">
            <div class="pokemon-info">
                <img src="" alt="Pokemon Image" id="pokemon-image" style="display: none;">
            </div>
            <div class="pokemon-info">
                <h2 id="pokemon-name"></h2>
            </div>
            <div class="pokemon-info">
                <h3 id="pokemon-type"></h3>

                <div class="error-card">

                    <h1 id="Pokemon-not-found"></h1>

                </div>
            </div>       
        </div>

      

    </div>


    <script src="script.js"></script>
</body>
</html>
